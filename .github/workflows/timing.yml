name: Timing Leak Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  timing-tests:
    name: Constant-time verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        run: rustup update nightly && rustup default nightly

      - name: Install benchmark system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Test timing result validation
        run: python3 -B scripts/test_check_timing_results.py

      - name: Build timing benchmarks
        run: cargo bench --locked -p oxcrypt-core --bench timing_leaks --no-run --message-format=json > timing-build.json

      - name: Run security-critical timing tests
        shell: bash
        run: python3 scripts/run-timing-tests.py timing-build.json
        env:
          RAYON_NUM_THREADS: 1

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: timing-results
          path: timing*.txt
