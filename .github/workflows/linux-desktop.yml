name: Linux Desktop Startup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-desktop.yml"
      - "scripts/test-linux-desktop.py"
      - "scripts/test_linux_desktop_harness.py"
      - "crates/oxcrypt-desktop/**"
      - "crates/oxcrypt-mount/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-desktop
      - name: Install desktop and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libfuse3-dev libxdo-dev \
            xvfb xauth xdotool dbus-x11
      - name: Verify harness failure detection
        run: python3 scripts/test_linux_desktop_harness.py
      - name: Build Linux desktop
        run: |
          cargo +stable build --locked -p oxcrypt-desktop \
            --no-default-features --features mimalloc,fuse,webdav,nfs
      - name: Verify visible window and clean shutdown
        run: |
          xvfb-run -a dbus-run-session -- python3 scripts/test-linux-desktop.py \
            target/debug/oxcrypt-desktop --log "${{ runner.temp }}/linux-desktop-smoke.log"
      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-startup
          path: ${{ runner.temp }}/linux-desktop-smoke.log
          if-no-files-found: ignore
